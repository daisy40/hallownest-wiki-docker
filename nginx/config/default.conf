# error_log /var/log/nginx/debug.log debug;

upstream php_fpm {
    server unix:/run/php/php8.3-fpm.sock;
}

server {
    listen 80;
    server_name hallownest.wiki;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name media.hallownest.wiki;

    ssl_certificate     /etc/letsencrypt/live/hallownest.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hallownest.wiki/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve x25519:prime256v1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    root /var/www/html;

    location /images {
        location ~ ^/images/thumb/(webp/)?(archive/)?[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ {
            expires 2h;
            add_header Cache-Control "public, no-transform";
            add_header Access-Control-Allow-Origin "https://hallownest.wiki" always;
            try_files $uri $uri/ @thumb;
        }
        expires 30d;
        add_header Cache-Control "public";
        add_header Access-Control-Allow-Origin "https://hallownest.wiki" always;
    }

    location /images/deleted {
        deny all;
    }

    location @thumb {
        rewrite ^/images/thumb/[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ /thumb.php?f=$1&width=$2;
        rewrite ^/images/thumb/archive/[0-9a-f]/[0-9a-f][0-9a-f]/([^/]+)/([0-9]+)px-.*$ /thumb.php?f=$1&width=$2&archived=1;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/thumb.php;
        fastcgi_pass php_fpm;
    }

    location ~ \.php$ {
        deny all;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name hallownest.wiki;
    root /var/www/html;
    index index.php;

    ssl_certificate     /etc/letsencrypt/live/hallownest.wiki/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hallownest.wiki/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ecdh_curve x25519:prime256v1;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/geo+json
        application/javascript
        application/x-javascript
        application/json
        application/ld+json
        application/manifest+json
        application/rdf+xml
        application/rss+xml
        application/xhtml+xml
        application/xml
        font/eot
        font/otf
        font/ttf
        image/svg+xml
        text/css
        text/javascript
        text/plain
        text/xml;

    location /rest.php {
        try_files $uri $uri/ /rest.php?$args;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME       $document_root/rest.php;
        fastcgi_pass php_fpm;
    }

    # Location for the wiki's root
    location / {
        try_files $uri $uri/ @mediawiki;
        # Do this inside of a location so it can be negated
        location ~ \.php$ {
            try_files $uri $uri/ =404; # Don't let php execute non-existent php files
            include fastcgi_params;
            fastcgi_pass php_fpm;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        }
    }

    # Redirect to domain root icons
    location ~* ^/favicon {
        root /var/www/html/resources/assets/favicon;
    }

    # iOS Safari probes legacy variants (-precomposed, -120x120, etc.)
    # even when apple-touch-icon.png is shipped; silence the 404 noise.
    location ~* ^/apple-touch-icon {
        root /var/www/html/resources/assets/favicon;
        log_not_found off;
        access_log off;
    }

    # Assets, scripts and styles from skins and extensions
    location ~ ^/(skins|extensions)/.+\.(css|js|gif|jpg|jpeg|png|svg|wasm|ttf|woff|woff2)$ {
        try_files $uri 404;
        add_header Cache-Control "public";
        expires 30d;
    }

    location ~ ^/(skins|extensions)/.+\.php$ {
        deny all;
    }

    # License and credits files
    location ~ ^/(COPYING|CREDITS)$ {
        default_type text/plain;
    }

    # Deny access to folders MediaWiki has a .htaccess deny in
    location /cache       { deny all; }
    location /languages   { deny all; }
    location /maintenance { deny all; }
    location /serialized  { deny all; }

    # Just in case, hide .svn and .git too
    location ~ /\.(svn|git)(/|$) { deny all; }

    # Hide any .htaccess files
    location ~ /\.ht { deny all; }

    # Uncomment the following code if you wish to hide the installer/updater
    ## Deny access to the installer
    location /mw-config { deny all; }

    # Handling for the article path
    location @mediawiki {
        include fastcgi_params;
        # article path should always be passed to index.php
        fastcgi_param SCRIPT_FILENAME       $document_root/index.php;
        fastcgi_pass php_fpm;
    }
}
